name: Atualiza animação de contribuições

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pacman.yml"

permissions:
  contents: write

concurrency:
  group: profile-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gera Pac-Man com as contribuições do perfil
        uses: abozanona/pacman-contribution-graph@294c47eff28a41339a279107ae771b5fa020037a
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman

      - name: Publica os SVGs na branch output
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
        with:
          target_branch: output
          build_dir: dist
          commit_message: Atualiza animação das contribuições
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
