<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title desc">
  <title id="title">Robótica móvel e percepção</title>
  <desc id="desc">Um robô diferencial se desloca enquanto seu sensor LiDAR varre o ambiente. Pontos representam leituras dos sensores.</desc>
  <defs>
    <radialGradient id="scan">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".32"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#64748b" stroke-opacity=".12" stroke-width=".7"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="898" height="178" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="178" rx="16" fill="url(#grid)"/>
  <g fill="none" stroke="#475569" stroke-width="2">
    <path d="M170 53H240V75M650 105V130H715"/>
    <rect x="282" y="118" width="45" height="20" rx="4"/>
    <rect x="590" y="38" width="38" height="20" rx="4"/>
  </g>
  <path d="M180 98C260 98 280 85 360 85S470 100 540 95S640 80 720 80"
        fill="none" stroke="#2dd4bf" stroke-opacity=".4" stroke-width="2" stroke-dasharray="4 7">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="3s" repeatCount="indefinite"/>
  </path>
  <g fill="#38bdf8">
    <circle cx="240" cy="75" r="3"/><circle cx="212" cy="53" r="2"/>
    <circle cx="282" cy="118" r="2.5"/><circle cx="327" cy="118" r="2"/>
    <circle cx="590" cy="58" r="2.5"/><circle cx="628" cy="58" r="2"/>
    <circle cx="650" cy="105" r="3"/><circle cx="684" cy="130" r="2"/>
    <animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(450 90)">
    <animateTransform attributeName="transform" type="translate"
      values="400 90;450 87;500 90;450 93;400 90" dur="12s" repeatCount="indefinite"/>
    <circle r="70" fill="none" stroke="#38bdf8" stroke-opacity=".12"/>
    <circle r="48" fill="none" stroke="#38bdf8" stroke-opacity=".12" stroke-dasharray="2 6"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <path d="M0 0L-36-60A70 70 0 0 1 36-60Z" fill="url(#scan)"/>
      <path d="M0 0V-70" stroke="#38bdf8" stroke-opacity=".65" stroke-width="1"/>
      <circle cy="-70" r="2.5" fill="#7dd3fc"/>
    </g>
    <rect x="-22" y="-26" width="12" height="13" rx="3" fill="#64748b"/>
    <rect x="-22" y="13" width="12" height="13" rx="3" fill="#64748b"/>
    <rect x="10" y="-26" width="12" height="13" rx="3" fill="#64748b"/>
    <rect x="10" y="13" width="12" height="13" rx="3" fill="#64748b"/>
    <rect x="-25" y="-17" width="50" height="34" rx="12" fill="#172b3a" stroke="#7dd3fc" stroke-width="1.5"/>
    <path d="M14-7L21 0L14 7" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-5" r="8" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="-5" r="3" fill="#38bdf8">
      <animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
