<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
<title id="title">Diogo Hantke</title>
<desc id="desc">Banner animado com trilhas de circuito. Robótica, controle e sistemas embarcados.</desc>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#2dd4bf"/>
    <animate attributeName="x1" values="0;0.4;0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width=".5"/>
  </pattern>
</defs>
<rect width="960" height="230" rx="18" fill="#0d1117"/>
<rect width="960" height="230" rx="18" fill="url(#grid)"/>
<g fill="none" stroke="#38bdf8" stroke-width="2" opacity=".25">
  <path d="M0 65H135L170 100H225"/>
  <path d="M0 165H120L150 135H210"/>
  <path d="M960 65H825L790 100H735"/>
  <path d="M960 165H840L810 135H750"/>
</g>
<g fill="#38bdf8">
  <circle r="3"><animateMotion path="M0 65H135L170 100H225" dur="4s" repeatCount="indefinite"/></circle>
  <circle r="3"><animateMotion path="M960 165H840L810 135H750" dur="4s" begin="-2s" repeatCount="indefinite"/></circle>
</g>
<text x="480" y="110" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="4" fill="url(#accent)">DIOGO HANTKE</text>
<text x="480" y="151" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="3" fill="#cbd5e1">ROBÓTICA · CONTROLE · SISTEMAS EMBARCADOS</text>
<rect x="370" y="177" width="220" height="2" rx="1" fill="url(#accent)">
  <animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/>
</rect>
</svg>
